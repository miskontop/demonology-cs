<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Demonology Cheat Sheet</title>
    <style>
        :root {
            --bg-color: #0d0f12;
            --card-bg: #161a22;
            --text-main: #f0f3f5;
            --text-muted: #8b949e;
            --primary: #da3633;
            --state-neutral: #21262d;
            --state-included: #238636;
            --state-excluded: #da3633;
            --border-color: #30363d;
            --highlight-gold: #f1c40f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            line-height: 1.6;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        header h1 {
            color: var(--text-main);
            font-size: 2.5rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        header p {
            color: var(--text-muted);
            margin-top: 5px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 30px;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        /* Evidence Panel Styles */
        .evidence-panel {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            height: fit-content;
            position: sticky;
            top: 20px;
        }

        .panel-title {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: var(--text-main);
            text-transform: uppercase;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 5px;
        }

        .evidence-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .evidence-btn {
            background-color: var(--state-neutral);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            text-align: left;
            transition: all 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .evidence-btn:hover {
            opacity: 0.9;
        }

        .evidence-btn.included {
            background-color: var(--state-included);
            border-color: #3fb950;
        }

        .evidence-btn.included::after {
            content: "✓";
        }

        .evidence-btn.excluded {
            background-color: var(--state-excluded);
            border-color: #f85149;
            text-decoration: line-through;
            opacity: 0.5;
        }

        .evidence-btn.excluded::after {
            content: "✕";
        }

        .evidence-btn.impossible {
            background-color: #12141a;
            color: #484f58;
            border-color: #21262d;
            text-decoration: line-through;
            opacity: 0.25;
            pointer-events: none;
            cursor: not-allowed;
        }

        /* Options Toggle Styles */
        .options-group {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid var(--border-color);
        }

        .toggle-label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
            color: var(--text-muted);
            cursor: pointer;
            user-select: none;
            line-height: 1.3;
        }

        .toggle-label input {
            cursor: pointer;
            accent-color: var(--state-included);
            width: 16px;
            height: 16px;
        }

        .reset-btn {
            margin-top: 15px;
            width: 100%;
            background-color: transparent;
            color: var(--text-muted);
            border: 1px dashed var(--border-color);
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .reset-btn:hover {
            background-color: rgba(218, 54, 51, 0.1);
            color: #ff7b72;
        }

        /* Ghost Grid Styles */
        .ghost-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .ghost-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            transition: all 0.25s ease;
        }

        .ghost-card.faded {
            opacity: 0.15;
            pointer-events: none;
            transform: scale(0.98);
        }

        /* Highlighted Identified Ghost Style */
        .ghost-card.final-match {
            border-color: var(--highlight-gold);
            box-shadow: 0 0 15px rgba(241, 196, 15, 0.15);
            background-color: rgba(241, 196, 15, 0.02);
            transform: scale(1.02);
        }

        .ghost-name {
            font-size: 1.4rem;
            color: #ff7b72;
            margin-bottom: 10px;
            text-transform: uppercase;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .ghost-card.final-match .ghost-name {
            color: var(--highlight-gold);
        }

        .ghost-card.final-match .ghost-name::after {
            content: "IDENTIFIED";
            font-size: 0.7rem;
            background-color: var(--highlight-gold);
            color: #0d0f12;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .ghost-evidence {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-bottom: 15px;
        }

        .evidence-tag {
            background-color: rgba(255, 255, 255, 0.05);
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
        }

        .evidence-tag.highlight {
            color: #58a6ff;
            border-color: #388bfd;
            background-color: rgba(56, 139, 253, 0.1);
        }

        .traits {
            font-size: 0.85rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 10px;
        }

        .trait-title {
            font-weight: bold;
            color: var(--text-main);
        }
        
        .trait-desc {
            color: var(--text-muted);
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Demonology Cheat Sheet</h1>
        <p>Interactive evidence filtering tool for the Roblox Demonology game</p>
    </header>

    <div class="container">
        <aside class="evidence-panel">
            <div class="panel-title">Evidence Filters</div>
            <div class="evidence-grid">
                <button class="evidence-btn" data-evidence="emf">EMF Level 5</button>
                <button class="evidence-btn" data-evidence="handprints">Handprints</button>
                <button class="evidence-btn" data-evidence="spirit_box">Spirit Box</button>
                <button class="evidence-btn" data-evidence="ghost_orb">Ghost Orb</button>
                <button class="evidence-btn" data-evidence="freezing">Freezing Temps</button>
                <button class="evidence-btn" data-evidence="writing">Ghost Writing</button>
                <button class="evidence-btn" data-evidence="projector">Laser Projector</button>
                <button class="evidence-btn" data-evidence="wither">Wither</button>
            </div>

            <div class="options-group">
                <label class="toggle-label">
                    <input type="checkbox" id="sort-possible-toggle" checked>
                    <span>Always bring possible ghosts to the top</span>
                </label>
            </div>

            <button class="reset-btn" id="reset-btn">Clear All Filters</button>
        </aside>

        <main class="ghost-list" id="ghost-container">
            </main>
    </div>

    <script>
        // Official exact data synchronized directly from the Demonology Wiki
        const ghosts = [
            { name: "Aswang", evidence: ["emf", "writing", "wither"], strength: "Speed increases every time they kill.", weakness: "Salt slows them. Only ghost with both Wither and Ghost Writing evidence." },
            { name: "Banshee", evidence: ["freezing", "ghost_orb", "handprints"], strength: "Can break multiple windows/mirrors at once.", weakness: "Can sometimes let out a unique wail at the start of its hunt." },
            { name: "Demon", evidence: ["emf", "freezing", "handprints"], strength: "Hunts frequently.", weakness: "Crosses have a larger range and cause them to float upon burning." },
            { name: "Dullahan", evidence: ["freezing", "projector", "wither"], strength: "Appear headless in photos, making the Photo Camera highly useful.", weakness: "Increases in speed the longer someone is within line-of-sight." },
            { name: "Dybbuk", evidence: ["freezing", "handprints", "wither"], strength: "Can throw corpses around the environment.", weakness: "Stunned completely after the music box is first played." },
            { name: "Entity", evidence: ["handprints", "projector", "spirit_box"], strength: "Able to teleport cleanly between structural rooms.", weakness: "Can teleport environmental objects, indicated by a visual smoke effect." },
            { name: "Ghoul", evidence: ["freezing", "ghost_orb", "spirit_box"], strength: "Excessive messages typed into chat log channels will directly cause an immediate hunt.", weakness: "Completely unable to disable local electronics." },
            { name: "Keres", evidence: ["handprints", "spirit_box", "wither"], strength: "Targets the hunter with the least energy. (In Solo configurations: targets if you sit below 90% energy).", weakness: "Movement speed actively decreases every single time they secure a kill." },
            { name: "Leviathan", evidence: ["writing", "handprints", "ghost_orb"], strength: "Capable of throwing multiple items simultaneously.", weakness: "Passively turns off nearby light installations." },
            { name: "Nightmare", evidence: ["emf", "ghost_orb", "spirit_box"], strength: "Can actively cause persistent auditory hallucinations for target players.", weakness: "Extremely afraid of lit rooms." },
            { name: "Oni", evidence: ["freezing", "projector", "spirit_box"], strength: "Extremely fast during standard hunting segments.", weakness: "Highly likely to start ghost events and easily reveal its physical appearance." },
            { name: "Phantom", evidence: ["emf", "handprints", "ghost_orb"], strength: "Moves significantly faster while completely invisible during hunts.", weakness: "Blinks in-and-out much slower than typical baseline entities." },
            { name: "Revenant", evidence: ["emf", "freezing", "writing"], strength: "Operates on a significantly low hunting cooldown cycle.", weakness: "Immediately halts its active hunt once any single player is successfully killed." },
            { name: "Shadow", evidence: ["emf", "writing", "projector"], strength: "Causes much lower temperature modifications than traditional ghosts.", weakness: "Significantly less likely to perform environmental ghost activity inside lit rooms." },
            { name: "Siren", evidence: ["emf", "spirit_box", "wither"], strength: "Anyone lingering inside its visual line-of-sight will be heavily slowed down.", weakness: "Responds strictly with a female voice/model. Can hum into the Spirit box ('-HUMMING-') instead of normal speech." },
            { name: "Skinwalker", evidence: ["freezing", "writing", "spirit_box"], strength: "Intelligently mimics other ghost behaviors and unique baseline abilities.", weakness: "Fakes the Ghost Orb evidence to intentionally misdirect investigations." },
            { name: "Specter", evidence: ["emf", "freezing", "projector"], strength: "Throws items frequently around rooms.", weakness: "Does not roam; will strictly stick inside its designated ghost room except while hunting." },
            { name: "Spirit", evidence: ["writing", "handprints", "spirit_box"], strength: "Standard unpredictable baseline interaction patterns.", weakness: "Possesses the unique magical property to alter lit up candles to a blue flame color." },
            { name: "The Wisp", evidence: ["projector", "ghost_orb", "wither"], strength: "Possesses the ability to ignite standard candles.", weakness: "Can walk cleanly through lines of fire. Can only initiate a hunt when a player stands in its favorite room." },
            { name: "Umbra", evidence: ["handprints", "ghost_orb", "projector"], strength: "Does not produce standard audible footstep sounds while walking.", weakness: "Moves noticeably slower inside lit rooms." },
            { name: "Vex", evidence: ["freezing", "ghost_orb", "wither"], strength: "Capable of walking cleanly through physical boundaries and walls.", weakness: "Completely invisible to standard LIDAR Scan readouts." },
            { name: "Wendigo", evidence: ["writing", "ghost_orb", "projector"], strength: "Increases in movement speed dynamically as average player energy values decrease.", weakness: "Significantly less likely to launch hunts near active, open flames (Candles or Lanterns)." },
            { name: "Wraith", evidence: ["emf", "projector", "spirit_box"], strength: "Depletes a player's raw energy rapidly at a rate of roughly 0.2% - 0.4% per second.", weakness: "Will never step on or disturb lines of salt." }
        ];

        const evidenceNames = {
            emf: "EMF Level 5",
            handprints: "Handprints",
            spirit_box: "Spirit Box",
            ghost_orb: "Ghost Orb",
            freezing: "Freezing Temps",
            writing: "Ghost Writing",
            projector: "Laser Projector",
            wither: "Wither"
        };

        let filterStates = { emf: 0, handprints: 0, spirit_box: 0, ghost_orb: 0, freezing: 0, writing: 0, projector: 0, wither: 0 };

        const ghostContainer = document.getElementById("ghost-container");
        const buttons = document.querySelectorAll(".evidence-btn");
        const resetBtn = document.getElementById("reset-btn");
        const sortToggle = document.getElementById("sort-possible-toggle");

        function init() {
            renderGhosts();
            setupEventListeners();
        }

        function renderGhosts() {
            ghostContainer.innerHTML = "";
            ghosts.sort((a, b) => a.name.localeCompare(b.name)).forEach(ghost => {
                const card = document.createElement("div");
                card.className = "ghost-card";
                card.id = `ghost-${ghost.name}`;

                const tagsHTML = ghost.evidence.map(ev => 
                    `<span class="evidence-tag" data-ev-tag="${ev}">${evidenceNames[ev]}</span>`
                ).join("");

                card.innerHTML = `
                    <div class="ghost-name">${ghost.name}</div>
                    <div class="ghost-evidence">${tagsHTML}</div>
                    <div class="traits">
                        <div class="trait-title">Strength:</div>
                        <div class="trait-desc">${ghost.strength}</div>
                        <div class="trait-title">Weakness:</div>
                        <div class="trait-desc">${ghost.weakness}</div>
                    </div>
                `;
                ghostContainer.appendChild(card);
            });
            applyFiltering();
        }

        function setupEventListeners() {
            buttons.forEach(btn => {
                btn.addEventListener("click", () => {
                    const type = btn.getAttribute("data-evidence");
                    
                    if (filterStates[type] === 0) {
                        filterStates[type] = 1;
                        btn.className = "evidence-btn included";
                    } else if (filterStates[type] === 1) {
                        filterStates[type] = -1;
                        btn.className = "evidence-btn excluded";
                    } else {
                        filterStates[type] = 0;
                        btn.className = "evidence-btn";
                    }
                    applyFiltering();
                });
            });

            sortToggle.addEventListener("change", applyFiltering);

            resetBtn.addEventListener("click", () => {
                Object.keys(filterStates).forEach(k => filterStates[k] = 0);
                buttons.forEach(b => b.className = "evidence-btn");
                applyFiltering();
            });
        }

        function applyFiltering() {
            const activeGhosts = [];
            let selectedEvidenceCount = Object.values(filterStates).filter(s => s === 1).length;

            // Step 1: Base validation mapping
            ghosts.forEach(ghost => {
                let valid = true;
                for (const [evidence, state] of Object.entries(filterStates)) {
                    if (state === 1 && !ghost.evidence.includes(evidence)) valid = false;
                    if (state === -1 && ghost.evidence.includes(evidence)) valid = false;
                }

                const element = document.getElementById(`ghost-${ghost.name}`);
                element.classList.remove("final-match");

                if (valid) {
                    element.classList.remove("faded");
                    activeGhosts.push(ghost);
                } else {
                    element.classList.add("faded");
                }
            });

            // Step 2: Handle Final Identification rule
            const isFinalUniqueMatch = (activeGhosts.length === 1 && selectedEvidenceCount === 3);
            if (isFinalUniqueMatch) {
                const identifiedElement = document.getElementById(`ghost-${activeGhosts[0].name}`);
                identifiedElement.classList.add("final-match");
            }

            // Step 3: Run Dynamic DOM Sorting Engine
            const shouldSortAllPossible = sortToggle.checked;
            
            let sortedOrder = [...ghosts].sort((a, b) => {
                const elA = document.getElementById(`ghost-${a.name}`);
                const elB = document.getElementById(`ghost-${b.name}`);
                
                const isFinalA = elA.classList.contains("final-match");
                const isFinalB = elB.classList.contains("final-match");
                
                if (isFinalA) return -1;
                if (isFinalB) return 1;

                if (shouldSortAllPossible) {
                    const isFadedA = elA.classList.contains("faded");
                    const isFadedB = elB.classList.contains("faded");
                    if (!isFadedA && isFadedB) return -1;
                    if (isFadedA && !isFadedB) return 1;
                }

                return a.name.localeCompare(b.name);
            });

            sortedOrder.forEach(ghost => {
                const el = document.getElementById(`ghost-${ghost.name}`);
                ghostContainer.appendChild(el);
            });

            // Step 4: Handle button lockouts for mathematically impossible combinations
            const poolOfPossibleEvidence = new Set();
            activeGhosts.forEach(ghost => ghost.evidence.forEach(ev => poolOfPossibleEvidence.add(ev)));

            buttons.forEach(btn => {
                const type = btn.getAttribute("data-evidence");

                activeGhosts.forEach(ghost => {
                    const element = document.getElementById(`ghost-${ghost.name}`);
                    const tag = element.querySelector(`[data-ev-tag="${type}"]`);
                    if (tag) {
                        if (filterStates[type] === 1) {
                            tag.classList.add("highlight");
                        } else {
                            tag.classList.remove("highlight");
                        }
                    }
                });

                if (filterStates[type] === 0) {
                    if (!poolOfPossibleEvidence.has(type)) {
                        btn.classList.add("impossible");
                    } else {
                        btn.classList.remove("impossible");
                    }
                } else {
                    btn.classList.remove("impossible");
                }
            });
        }

        init();
    </script>
</body>
</html>

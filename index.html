<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Demonology Cheat Sheet</title>
    <style>
        :root {
            --bg-color: #0d0f12;
            --card-bg: #161a22;
            --text-main: #f0f3f5;
            --text-muted: #8b949e;
            --primary: #da3633;
            --state-neutral: #21262d;
            --state-included: #238636;
            --state-excluded: #da3633;
            --border-color: #30363d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            line-height: 1.6;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        header h1 {
            color: var(--text-main);
            font-size: 2.5rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        header p {
            color: var(--text-muted);
            margin-top: 5px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 30px;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        /* Evidence Panel Styles */
        .evidence-panel {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            height: fit-content;
            position: sticky;
            top: 20px;
        }

        .panel-title {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: var(--text-main);
            text-transform: uppercase;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 5px;
        }

        .evidence-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .evidence-btn {
            background-color: var(--state-neutral);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            text-align: left;
            transition: all 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }

        .evidence-btn:hover {
            opacity: 0.9;
        }

        .evidence-btn.included {
            background-color: var(--state-included);
            border-color: #3fb950;
        }

        .evidence-btn.included::after {
            content: "✓";
        }

        .evidence-btn.excluded {
            background-color: var(--state-excluded);
            border-color: #f85149;
            text-decoration: line-through;
            opacity: 0.5;
        }

        .evidence-btn.excluded::after {
            content: "✕";
        }

        /* Impossible State Style */
        .evidence-btn.impossible {
            background-color: #12141a;
            color: #484f58;
            border-color: #21262d;
            text-decoration: line-through;
            opacity: 0.25;
            pointer-events: none; /* Locks the button from clicks */
            cursor: not-allowed;
        }

        .reset-btn {
            margin-top: 15px;
            width: 100%;
            background-color: transparent;
            color: var(--text-muted);
            border: 1px dashed var(--border-color);
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .reset-btn:hover {
            background-color: rgba(218, 54, 51, 0.1);
            color: #ff7b72;
        }

        /* Ghost Grid Styles */
        .ghost-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .ghost-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            transition: opacity 0.3s ease, transform 0.2s ease;
        }

        .ghost-card.faded {
            opacity: 0.
